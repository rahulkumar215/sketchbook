# Routine update PRs once a month. Security updates are separate and arrive
# as soon as an advisory is published (Settings > Advanced Security).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Types must match the oldest supported Node (package.json engines).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native compiler) isn't supported by the tooling yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for every minor and patch update; majors come one per PR.
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
