name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: markdown
    attributes:
      value: |
        Sketchbook is single-user on purpose, so accounts, sharing and
        real-time collaboration are out of scope for now.
